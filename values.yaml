global:
  spire:
    trustDomain: wealthy.local
    clusterName: demo-cluster

spiffe-oidc-discovery-provider:
  enabled: false

spire-server:
  nodeAttestor:
    joinToken:
      enabled: true

  controllerManager:
    identities:
      clusterStaticEntries:
        shipping:
          parentID: spiffe://wealthy.local/vm/shipping-host
          spiffeID: spiffe://wealthy.local/vm/shipping
          selectors:
            - docker:label:app:shipping
